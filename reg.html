<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Register" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />

    <title>Register</title>

    <style>
      :root {
        --bg: #f7f7f5;
        --register: #2f7d5c;
        --tue: #e8b100;
        --wed: #2b7a9e;
        --thu: #3f9d5c;
        --fri: #c96a1f;
        --present: #3f9d5c;
        --absent: #d1495b;
        --ink: #2a2a26;
        --line: #d9d7d1;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        min-height: 100dvh;
        font-family: "Chalkboard SE", "Comic Sans MS", cursive;
        color: var(--ink);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px 4px 16px;
      }
      header a.back {
        text-decoration: none;
        display: inline-block;
      }
      header h1 {
        margin: 0;
        font-weight: normal;
        font-size: clamp(22px, 5vmin, 32px);
        color: var(--register);
      }

      .month-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 4px 16px 14px 16px;
      }
      .month-nav button {
        border: none;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        width: 40px;
        height: 40px;
        font-size: 20px;
        font-family: inherit;
        color: var(--register);
      }
      .month-nav button:active {
        transform: scale(0.95);
      }
      .month-nav .month-label {
        font-size: 24px;
        min-width: 170px;
        text-align: center;
      }

      .legend {
        display: flex;
        justify-content: center;
        gap: 18px;
        font-size: 14px;
        opacity: 0.75;
        padding-bottom: 10px;
      }
      .legend .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
      }
      .legend .present .dot {
        background: var(--present);
      }
      .legend .absent .dot {
        background: var(--absent);
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px calc(24px + env(safe-area-inset-bottom)) 12px;
      }

      #registerGrid {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .day-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .day-heading {
        margin: 0 0 2px 4px;
        font-size: 20px;
        font-weight: normal;
        opacity: 0.7;
      }
      .day-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }

      .class-block {
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
      }
      .block-head {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 12px;
        color: #fff;
      }
      .block-time {
        font-size: 18px;
        font-weight: bold;
      }
      .block-label {
        font-size: 14px;
        opacity: 0.95;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: center;
        padding: 6px 4px;
        font-size: 15px;
      }
      thead th {
        border-bottom: 1px solid var(--line);
        font-weight: normal;
        opacity: 0.7;
      }
      th.name-col,
      td.name-col {
        text-align: left;
        padding-left: 10px;
        white-space: nowrap;
      }
      tbody tr:not(:last-child) td {
        border-bottom: 1px solid var(--line);
      }

      .mark {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
      }
      .mark.present {
        background: var(--present);
      }
      .mark.absent {
        background: var(--absent);
      }
      .mark.future {
        background: #eee;
        color: transparent;
      }
      .mark:not(.future):active {
        transform: scale(0.9);
      }

      .no-students,
      .empty-hint {
        padding: 14px;
        opacity: 0.5;
        font-size: 15px;
        text-align: center;
      }
      .empty-hint {
        margin-top: 40px;
      }

      #status {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 14px;
        font-size: 14px;
        opacity: 0.5;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="index.html">
        <h1>Register</h1>
      </a>
    </header>
    <div id="status"></div>

    <div class="month-nav">
      <button id="prevMonthBtn">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonthBtn">›</button>
    </div>
    <div class="legend">
      <span class="present"><span class="dot"></span>Present</span>
      <span class="absent"><span class="dot"></span>Absent</span>
    </div>

    <main>
      <div id="registerGrid"></div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        onSnapshot,
        setDoc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAegz9XGRoiPIJZW_Iw9IrXXMYx_-EDn9E",
        authDomain: "schedule-69a31.firebaseapp.com",
        projectId: "schedule-69a31",
        storageBucket: "schedule-69a31.firebasestorage.app",
        messagingSenderId: "211061390173",
        appId: "1:211061390173:web:158b55a901284e5b3e46b4",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const docRef = doc(db, "schedules", "main");

      const DAY_COLORS = {
        tue: "var(--tue)",
        wed: "var(--wed)",
        thu: "var(--thu)",
        fri: "var(--fri)",
      };
      const DAY_ORDER = ["tue", "wed", "thu", "fri"];
      const DAY_INDEX = { tue: 2, wed: 3, thu: 4, fri: 5 };
      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      let allStudents = [];
      let allClasses = [];
      let attendanceLog = {};
      let scheduledEvents = [];

      let viewYear = new Date().getFullYear();
      let viewMonth = new Date().getMonth(); // 0-indexed

      const statusEl = document.getElementById("status");
      const grid = document.getElementById("registerGrid");
      const monthLabel = document.getElementById("monthLabel");

      onSnapshot(
        docRef,
        (snap) => {
          const data = snap.data();
          allStudents = (data && data.students) || [];
          allClasses = (data && data.classes) || [];
          attendanceLog = (data && data.attendanceLog) || {};
          scheduledEvents = (data && data.scheduledEvents) || [];
          statusEl.textContent = "";
          render();
        },
        (err) => {
          console.error(err);
          statusEl.textContent = "offline";
        },
      );

      document.getElementById("prevMonthBtn").addEventListener("click", () => {
        viewMonth--;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear--;
        }
        render();
      });
      document.getElementById("nextMonthBtn").addEventListener("click", () => {
        viewMonth++;
        if (viewMonth > 11) {
          viewMonth = 0;
          viewYear++;
        }
        render();
      });

      function studentName(id) {
        const s = allStudents.find((s) => s.id === id);
        return s ? s.name : "(removed)";
      }

      function dateStr(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      function newId() {
        return (
          (crypto.randomUUID && crypto.randomUUID()) ||
          `${Date.now()}-${Math.random().toString(16).slice(2)}`
        );
      }

      function attachDoubleTap(el, callback, delay = 300) {
        let lastTap = 0;
        el.addEventListener("click", () => {
          const now = Date.now();
          if (now - lastTap < delay) {
            callback();
            lastTap = 0;
          } else {
            lastTap = now;
          }
        });
      }
      function datesForDayInMonth(dayKey) {
        const targetIdx = DAY_INDEX[dayKey];
        const dates = [];
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const dt = new Date(viewYear, viewMonth, d);
          if (dt.getDay() === targetIdx) dates.push(dt);
        }
        return dates;
      }

      // The date this class's live daily-page status currently belongs to:
      // today if today IS that class's weekday, otherwise the most recent
      // past occurrence (mirrors the same logic each day page uses).
      function currentOccurrenceDate(dayKey) {
        const targetIdx = DAY_INDEX[dayKey];
        const now = new Date();
        const diff = (targetIdx - now.getDay() + 7) % 7;
        return new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() + diff,
        );
      }

      function toggleAttendance(classId, dayKey, studentId, dStr, makeAbsent) {
        // 1. always update the permanent history log
        const newLog = { ...attendanceLog };
        const classLog = { ...(newLog[classId] || {}) };
        const dayLog = { ...(classLog[dStr] || {}) };
        if (makeAbsent) {
          dayLog[studentId] = "absent";
        } else {
          delete dayLog[studentId];
        }
        if (Object.keys(dayLog).length === 0) {
          delete classLog[dStr];
        } else {
          classLog[dStr] = dayLog;
        }
        if (Object.keys(classLog).length === 0) {
          delete newLog[classId];
        } else {
          newLog[classId] = classLog;
        }
        attendanceLog = newLog;

        // 2. if this date is the class's current (this-week) occurrence,
        // also flip the live status shown on that day's page right now
        const isCurrentWeek = dStr === dateStr(currentOccurrenceDate(dayKey));
        let newClasses = allClasses;
        if (isCurrentWeek) {
          newClasses = allClasses.map((c) => {
            if (c.id !== classId) return c;
            const statuses = { ...(c.statuses || {}) };
            if (makeAbsent) {
              statuses[studentId] = "absent";
            } else {
              delete statuses[studentId];
            }
            return { ...c, statuses };
          });
          allClasses = newClasses;
        }

        // 3. if this date is further ahead than the next occurrence, queue
        // a scheduled event so the day page picks it up automatically once
        // that week's occurrence actually arrives.
        let newScheduledEvents = scheduledEvents;
        if (!isCurrentWeek) {
          const withoutExisting = scheduledEvents.filter(
            (e) =>
              !(
                e.type === "status" &&
                e.classId === classId &&
                e.studentId === studentId &&
                e.date === dStr
              ),
          );
          newScheduledEvents = makeAbsent
            ? [
                ...withoutExisting,
                {
                  id: newId(),
                  date: dStr,
                  day: dayKey,
                  classId,
                  type: "status",
                  studentId,
                  status: "absent",
                },
              ]
            : withoutExisting;
          scheduledEvents = newScheduledEvents;
        }

        render();

        const payload = { attendanceLog: newLog };
        if (isCurrentWeek) payload.classes = newClasses;
        if (!isCurrentWeek) payload.scheduledEvents = newScheduledEvents;
        updateDoc(docRef, payload).catch((e) => {
          console.error(e);
          statusEl.textContent = "sync error";
        });
      }

      const DAY_LABELS = {
        tue: "Tuesday",
        wed: "Wednesday",
        thu: "Thursday",
        fri: "Friday",
      };

      function render() {
        monthLabel.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
        grid.innerHTML = "";

        const dayGroups = DAY_ORDER.map((dayKey) => ({
          dayKey,
          classes: allClasses.filter(
            (c) =>
              c.day === dayKey &&
              c.type !== "important" &&
              c.timeColor !== "blue",
          ),
        })).filter((g) => g.classes.length > 0);

        if (dayGroups.length === 0) {
          grid.innerHTML =
            '<div class="empty-hint">No classes with rosters found.</div>';
          return;
        }

        const todayMidnight = new Date(new Date().toDateString());

        dayGroups.forEach(({ dayKey, classes }) => {
          const section = document.createElement("div");
          section.className = "day-section";

          const heading = document.createElement("h2");
          heading.className = "day-heading";
          heading.textContent = DAY_LABELS[dayKey];
          section.appendChild(heading);

          const dayGrid = document.createElement("div");
          dayGrid.className = "day-grid";

          classes.forEach((c) => {
            const dates = datesForDayInMonth(dayKey);

            const block = document.createElement("div");
            block.className = "class-block";

            const head = document.createElement("div");
            head.className = "block-head";
            head.style.background = DAY_COLORS[dayKey];
            const timeSpan = document.createElement("span");
            timeSpan.className = "block-time";
            timeSpan.textContent = c.time || "No time set";
            head.appendChild(timeSpan);
            if (c.label) {
              const labelSpan = document.createElement("span");
              labelSpan.className = "block-label";
              labelSpan.textContent = c.label;
              head.appendChild(labelSpan);
            }
            block.appendChild(head);

            const table = document.createElement("table");
            const thead = document.createElement("thead");
            const headRow = document.createElement("tr");
            const nameTh = document.createElement("th");
            nameTh.className = "name-col";
            nameTh.textContent = "Student";
            headRow.appendChild(nameTh);
            dates.forEach((d) => {
              const th = document.createElement("th");
              th.textContent = d.getDate();
              headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            const ids = c.studentIds || [];
            if (ids.length === 0) {
              const tr = document.createElement("tr");
              const td = document.createElement("td");
              td.colSpan = dates.length + 1;
              td.className = "no-students";
              td.textContent = "No students assigned.";
              tr.appendChild(td);
              tbody.appendChild(tr);
            } else {
              ids.forEach((sid) => {
                const tr = document.createElement("tr");
                const nameTd = document.createElement("td");
                nameTd.className = "name-col";
                nameTd.textContent = studentName(sid);
                tr.appendChild(nameTd);

                dates.forEach((d) => {
                  const dStr = dateStr(d);
                  const isFuture = d > todayMidnight;
                  const status =
                    attendanceLog[c.id] &&
                    attendanceLog[c.id][dStr] &&
                    attendanceLog[c.id][dStr][sid];
                  const isAbsent = status === "absent";
                  const showBlank = isFuture && !isAbsent;

                  const td = document.createElement("td");
                  const mark = document.createElement("div");
                  mark.className = `mark ${isAbsent ? "absent" : "present"}${
                    showBlank ? " future" : ""
                  }`;
                  mark.textContent = showBlank ? "" : isAbsent ? "✕" : "✓";

                  if (isFuture) {
                    attachDoubleTap(mark, () => {
                      toggleAttendance(c.id, dayKey, sid, dStr, !isAbsent);
                    });
                  } else {
                    mark.addEventListener("click", () => {
                      toggleAttendance(c.id, dayKey, sid, dStr, !isAbsent);
                    });
                  }
                  td.appendChild(mark);
                  tr.appendChild(td);
                });

                tbody.appendChild(tr);
              });
            }
            table.appendChild(tbody);
            block.appendChild(table);
            dayGrid.appendChild(block);
          });

          section.appendChild(dayGrid);
          grid.appendChild(section);
        });
      }
    </script>
  </body>
</html>
