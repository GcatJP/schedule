<!doctype html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="cat.png" />

    <title>Today</title>

    <style>
      :root {
        --bg: #f7f7f5;
        --ink: #2a2a26;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        min-height: 100dvh;
        font-family: "Chalkboard SE", "Comic Sans MS", cursive;
        color: var(--ink);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      p {
        font-size: clamp(22px, 5vmin, 30px);
        margin: 0;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <p id="message">Checking the day…</p>

    <script>
      // 0 = Sunday, 1 = Monday, 2 = Tuesday, ... 6 = Saturday
      const dayMap = {
        2: "day-tue.html",
        3: "day-wed.html",
        4: "day-thu.html",
        5: "day-fri.html",
      };

      const todayIndex = new Date().getDay();
      const target = dayMap[todayIndex];

      if (target) {
        window.location.replace(target);
      } else {
        document.getElementById("message").textContent = "No class today.";
        setTimeout(() => {
          window.location.replace("index.html");
        }, 1200);
      }
    </script>
  </body>
</html>
