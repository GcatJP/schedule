<!doctype html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Schedule" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="cat.png" />

    <title>Menu</title>

    <style>
      :root {
        --bg: #f7f7f5;
        --radius: 20px;
        --today: #2b7a9e;
        --day: #e8b100;
        --register: #d1495b;
        --events: #c96a1f;
        --payments: #7c5cc4;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: "Chalkboard SE", "Comic Sans MS", cursive;
      }
      nav.menu {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(5, minmax(0, 1fr));
        gap: 14px;
        padding-top: calc(18px + env(safe-area-inset-top));
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
        padding-left: calc(18px + env(safe-area-inset-left));
        padding-right: calc(18px + env(safe-area-inset-right));
      }
      @media (orientation: landscape) and (min-width: 820px) {
        nav.menu {
          grid-template-columns: repeat(5, minmax(0, 1fr));
          grid-template-rows: minmax(0, 1fr);
        }
      }
      a.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        text-decoration: none;
        color: #ffffff;
        font-size: clamp(20px, 5vmin, 44px);
        letter-spacing: 0.5px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
        overflow: hidden;
        white-space: nowrap;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }
      /* Bigger text on iPhone portrait only — iPad landscape keeps the rule above */
      @media (orientation: portrait) and (max-width: 600px) {
        a.btn {
          font-size: clamp(28px, 9vmin, 44px);
        }
      }
      a.btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
      }
      .btn-today {
        background: var(--today);
      }
      .btn-day {
        background: var(--day);
        color: #2a2a26;
      }
      .btn-week {
        background: var(--register);
      }
      .btn-events {
        background: var(--events);
      }
      .btn-payments {
        background: var(--payments);
      }
    </style>
  </head>

  <body>
    <nav class="menu">
      <a class="btn btn-today" href="today.html">Today</a>
      <a class="btn btn-day" href="day.html">Day</a>
      <a class="btn btn-week" href="reg.html">Register</a>
      <a class="btn btn-events" href="events.html">Events</a>
      <a class="btn btn-payments" href="payments.html">Payments</a>
    </nav>
    <script>
      function setAppHeight() {
        document.documentElement.style.setProperty(
          "--app-height",
          window.innerHeight + "px",
        );
      }
      setAppHeight();
      window.addEventListener("resize", setAppHeight);
      window.addEventListener("orientationchange", () =>
        setTimeout(setAppHeight, 100),
      );
    </script>
  </body>
</html>
