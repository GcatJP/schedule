<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Wednesday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f7f5;
        --radius: 20px;
        --daycolor: #e8b100; /* Wednesday */
        --ink: #2a2a26;
        --line: #d9d7d1;

        --st-present: var(--ink);
        --st-absent: #e8b100;
        --st-special: #d1495b;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        min-height: 100dvh;
        font-family: "Patrick Hand", cursive;
        color: var(--ink);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
      }
      header a.back {
        text-decoration: none;
        display: inline-block;
      }
      header h1 {
        margin: 0;
        font-weight: normal;
        font-size: clamp(24px, 5vmin, 34px);
        color: var(--daycolor);
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .empty-hint {
        text-align: center;
        opacity: 0.5;
        font-size: 20px;
        margin-top: 40px;
      }

      .class-card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      .class-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 8px 14px;
        background: var(--daycolor);
        color: #fff;
      }
      .class-head.pressed {
        filter: brightness(0.92);
      }
      .class-head .time {
        font-size: 18px;
        font-weight: bold;
      }
      .class-head.banner-blue {
        background: #d1495b;
      }
      .class-head .label {
        font-size: 16px;
        opacity: 0.95;
      }
      .class-head .note {
        font-size: 18px;
        font-weight: bold;
        color: var(--st-special);
      }

      .roster {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px 10px 12px;
      }
      .student-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        border: 2px solid var(--line);
        background: #fff;
        font-size: 16px;
        white-space: nowrap;
        line-height: 1.2;
      }
      .student-chip.pressed {
        background: rgba(0, 0, 0, 0.06);
      }
      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .student-chip.st-present .status-dot {
        background: transparent;
        border: 2px solid var(--line);
      }
      .student-chip.st-absent .status-dot {
        background: var(--st-absent);
      }
      .student-chip.st-special .status-dot {
        background: var(--st-special);
      }
      .student-chip.st-present .student-name {
        color: var(--st-present);
      }
      .student-chip.st-absent {
        border-color: var(--st-absent);
      }
      .student-chip.st-absent .student-name {
        color: var(--st-absent);
      }
      .student-chip.st-special {
        border-color: var(--st-special);
      }
      .student-chip.st-special .student-name {
        color: var(--st-special);
      }

      .no-students {
        padding: 8px 14px 12px 14px;
        opacity: 0.5;
        font-size: 15px;
      }

      .important-card {
        border: 2px solid var(--st-special);
        border-radius: 14px;
        background: #fff;
        padding: 12px 16px;
      }
      .important-card.pressed {
        filter: brightness(0.97);
      }
      .important-card .important-text {
        color: var(--st-special);
        font-size: 17px;
        font-weight: bold;
      }

      @media (max-width: 500px) and (orientation: portrait) {
        header {
          padding: 4px 12px;
        }
        header h1 {
          font-size: 22px;
        }
        main {
          gap: 6px;
          padding: 0 10px calc(20px + env(safe-area-inset-bottom)) 10px;
        }
        .class-head {
          padding: 4px 10px;
          gap: 5px;
        }
        .class-head .time {
          font-size: 14px;
        }
        .class-head .label {
          font-size: 12px;
        }
        .class-head .note {
          font-size: 12px;
        }
        .roster {
          padding: 6px 8px 10px 8px;
          gap: 8px 5px;
        }
        .student-chip {
          padding: 3px 9px;
          font-size: 13px;
        }
        .status-dot {
          width: 8px;
          height: 8px;
        }
      }
      /* floating add-class button */
      .fab {
        position: fixed;
        right: 20px;
        bottom: calc(20px + env(safe-area-inset-bottom));
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--daycolor);
        color: #fff;
        border: none;
        font-size: 30px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }
      .fab:active {
        transform: scale(0.95);
      }

      /* overlay + sheets */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 10;
      }
      .overlay.show {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 480px;
        max-height: 85dvh;
        overflow-y: auto;
        background: var(--bg);
        border-radius: 20px 20px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sheet h2 {
        margin: 0 0 4px 0;
        font-weight: normal;
        font-size: 24px;
        text-align: center;
      }
      .sheet button.action {
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        font-family: inherit;
        font-size: 20px;
        background: #fff;
        color: var(--ink);
      }
      .sheet button.action.cancel {
        color: #888;
      }
      .sheet button.action.danger {
        color: var(--st-special);
      }
      .sheet button.action:active {
        transform: scale(0.98);
      }
      .sheet button.action.st-present {
        color: var(--st-present);
        border-color: var(--st-present);
      }
      .sheet button.action.st-absent {
        color: #fff;
        background: var(--st-absent);
        border-color: var(--st-absent);
      }
      .sheet button.action.st-special {
        color: #fff;
        background: var(--st-special);
        border-color: var(--st-special);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 16px;
        opacity: 0.7;
      }
      .field input[type="text"] {
        font-family: inherit;
        font-size: 20px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .roster-check-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 4px;
        font-size: 20px;
        border-bottom: 1px solid var(--line);
      }
      .roster-check-row input {
        width: 22px;
        height: 22px;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(90px + env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        font-size: 18px;
        max-width: 86vw;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
        z-index: 20;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      #status {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 14px;
        font-size: 14px;
        opacity: 0.5;
        z-index: 20;
      }
      #legend {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 14px;
        font-size: 20px;
        opacity: 0.6;
        z-index: 20;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="menu.html">
        <h1>Tuesday</h1>
      </a>
    </header>

    <div id="status"></div>
    <div id="legend"></div>
    <main id="classesContainer">
      <div class="empty-hint" id="emptyHint">
        No classes yet. Tap + to add one.
      </div>
    </main>

    <button class="fab" id="addClassBtn">+</button>

    <!-- fab choice sheet -->
    <div class="overlay" id="fabChoiceOverlay">
      <div class="sheet">
        <h2>Add</h2>
        <button class="action" id="addClassChoiceBtn">Add Class</button>
        <button
          class="action"
          id="addImportantChoiceBtn"
          style="color: var(--st-special); border-color: var(--st-special)"
        >
          Important
        </button>
        <button class="action cancel" id="fabChoiceCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- class action sheet (long-press class header) -->
    <div class="overlay" id="classOverlay">
      <div class="sheet">
        <h2 id="classSheetTitle">Class</h2>
        <button class="action" id="editTimeBtn">Notes</button>

        <button class="action" id="moveClassUpBtn">Move Up</button>
        <button class="action" id="moveClassDownBtn">Move Down</button>
        <button class="action" id="editRosterBtn">Edit Roster</button>
        <button class="action danger" id="deleteClassBtn">Delete Class</button>
        <button class="action cancel" id="classCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- status action sheet (tap a student) -->
    <div class="overlay" id="statusOverlay">
      <div class="sheet">
        <h2 id="statusSheetTitle">Student</h2>
        <button class="action st-present" id="setPresentBtn">Present</button>
        <button class="action st-absent" id="setAbsentBtn">Absent</button>
        <button class="action st-special" id="setSpecialBtn">Special</button>
        <button class="action cancel" id="statusCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- add / edit class time+label sheet -->
    <div class="overlay" id="classFormOverlay">
      <div class="sheet">
        <h2 id="classFormTitle">Add Class</h2>
        <div class="field">
          <label for="classTimeInput">Time</label>
          <input type="text" id="classTimeInput" placeholder="e.g. 4:00 PM" />
        </div>
        <div class="field">
          <label for="classLabelInput">Label (optional)</label>
          <input
            type="text"
            id="classLabelInput"
            placeholder="e.g. Adventure Island 2"
          />
        </div>
        <div class="field">
          <label for="classNoteInput">Note (optional, shown in red)</label>
          <input
            type="text"
            id="classNoteInput"
            placeholder="e.g. Room change this week"
          />
        </div>
        <div class="field">
          <label style="display: flex; align-items: center; gap: 10px">
            <input
              type="checkbox"
              id="timeBlueCheckbox"
              style="width: 20px; height: 20px"
            />
            Online
          </label>
        </div>
        <button
          class="action"
          id="saveClassFormBtn"
          style="background: var(--daycolor); color: #fff; border: none"
        >
          Save
        </button>
        <button class="action cancel" id="classFormCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- add/edit important note sheet -->
    <div class="overlay" id="importantFormOverlay">
      <div class="sheet">
        <h2 id="importantFormTitle">Add Important Note</h2>
        <div class="field">
          <label for="importantTextInput">Note</label>
          <input
            type="text"
            id="importantTextInput"
            placeholder="e.g. Field trip form due"
          />
        </div>
        <button
          class="action"
          id="saveImportantBtn"
          style="background: var(--st-special); color: #fff; border: none"
        >
          Save
        </button>
        <button class="action cancel" id="importantFormCancelBtn">
          Cancel
        </button>
      </div>
    </div>

    <!-- important note action sheet (long-press) -->
    <div class="overlay" id="importantOverlay">
      <div class="sheet">
        <h2 id="importantSheetTitle">Important</h2>
        <button class="action" id="editImportantBtn">Edit</button>
        <button class="action danger" id="deleteImportantBtn">Delete</button>
        <button class="action cancel" id="importantCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- roster edit sheet -->
    <div class="overlay" id="rosterOverlay">
      <div class="sheet">
        <h2>Edit Roster</h2>

        <div
          class="field"
          style="flex-direction: row; align-items: flex-end; gap: 8px"
        >
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <label for="newStudentInput">Add new student</label>
            <input
              type="text"
              id="newStudentInput"
              placeholder="Student name"
            />
          </div>
          <button
            class="action"
            id="addNewStudentBtn"
            style="
              width: auto;
              padding: 12px 16px;
              background: var(--daycolor);
              color: #fff;
              border: none;
            "
          >
            Add
          </button>
        </div>

        <div id="rosterCheckList"></div>
        <button
          class="action"
          id="saveRosterBtn"
          style="background: var(--daycolor); color: #fff; border: none"
        >
          Save
        </button>
        <button class="action cancel" id="rosterCancelBtn">Cancel</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        onSnapshot,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAegz9XGRoiPIJZW_Iw9IrXXMYx_-EDn9E",
        authDomain: "schedule-69a31.firebaseapp.com",
        projectId: "schedule-69a31",
        storageBucket: "schedule-69a31.firebasestorage.app",
        messagingSenderId: "211061390173",
        appId: "1:211061390173:web:158b55a901284e5b3e46b4",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const docRef = doc(db, "schedules", "main");

      const DAY_KEY = "tue"; // <-- differs per day file
      // Maps each day file's key to JS Date.getDay() (0=Sun ... 6=Sat)
      const DAY_INDEX = {
        sun: 0,
        mon: 1,
        tue: 2,
        wed: 3,
        thu: 4,
        fri: 5,
        sat: 6,
      };
      const LONG_PRESS_MS = 500;
      const MOVE_TOLERANCE = 10;

      let allStudents = []; // full students array from Firestore
      let allClasses = []; // full classes array from Firestore (all days)
      let dayResets = {}; // tracks the last reset date per day, e.g. { tue: "2026-08-18" }
      let attendanceLog = {}; // permanent history: { [classId]: { [dateStr]: { [studentId]: "absent" } } }
      let activeClassId = null;
      let activeStudentId = null;

      const statusEl = document.getElementById("status");
      const container = document.getElementById("classesContainer");
      const emptyHint = document.getElementById("emptyHint");

      renderLegendDate();

      onSnapshot(
        docRef,
        (snap) => {
          const data = snap.data();
          allStudents = (data && data.students) || [];
          allClasses = (data && data.classes) || [];
          dayResets = (data && data.dayResets) || {};
          attendanceLog = (data && data.attendanceLog) || {};
          statusEl.textContent = "";
          maybeResetForNewDay();
          render();
        },
        (err) => {
          console.error(err);
          statusEl.textContent = "offline";
        },
      );

      async function saveClasses(newClasses) {
        allClasses = newClasses;
        render();
        try {
          await setDoc(docRef, { classes: newClasses }, { merge: true });
        } catch (e) {
          console.error(e);
          statusEl.textContent = "sync error";
        }
      }
      async function saveStudents(newStudents) {
        allStudents = newStudents;
        try {
          await setDoc(docRef, { students: newStudents }, { merge: true });
        } catch (e) {
          console.error(e);
          statusEl.textContent = "sync error";
        }
      }
      function newId() {
        return (
          (crypto.randomUUID && crypto.randomUUID()) ||
          `${Date.now()}-${Math.random().toString(16).slice(2)}`
        );
      }

      function dayStudents() {
        return allStudents.filter((s) => s.day === DAY_KEY);
      }

      function dayClasses() {
        return allClasses.filter(
          (c) => c.day === DAY_KEY && c.type !== "important",
        );
      }

      function dayImportants() {
        return allClasses.filter(
          (c) => c.day === DAY_KEY && c.type === "important",
        );
      }

      function studentName(id) {
        const s = allStudents.find((s) => s.id === id);
        return s ? s.name : "(removed)";
      }

      function todayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      // The calendar date this page's data currently belongs to: today's
      // date if today IS this page's day, otherwise the most recent past
      // occurrence of that day (since the data isn't cleared until the
      // next midnight rollover into this day).
      function currentOccurrenceDate() {
        const targetIdx = DAY_INDEX[DAY_KEY];
        const now = new Date();
        const currentDow = now.getDay(); // 0=Sun..6=Sat
        const mondayOffset = currentDow === 0 ? -6 : 1 - currentDow;
        const monday = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() + mondayOffset,
        );
        const targetOffsetFromMonday = targetIdx === 0 ? 6 : targetIdx - 1;
        return new Date(
          monday.getFullYear(),
          monday.getMonth(),
          monday.getDate() + targetOffsetFromMonday,
        );
      }

      function renderLegendDate() {
        const el = document.getElementById("legend");
        if (!el) return;
        const d = currentOccurrenceDate();
        el.textContent = d.toLocaleDateString(undefined, {
          month: "long",
          day: "numeric",
        });
      }

      function maybeResetForNewDay() {
        // Only ever reset this page's data when today actually IS this
        // page's day of the week. Otherwise, opening the Wednesday page
        // on, say, a Tuesday would wrongly wipe Wednesday's notes/statuses
        // just because the date differs from the last stored reset date.
        if (new Date().getDay() !== DAY_INDEX[DAY_KEY]) return;

        const today = todayStr();
        if (dayResets[DAY_KEY] === today) return;

        const updated = allClasses
          .filter((c) => {
            if (c.day !== DAY_KEY) return true;
            if (c.type === "important") return false; // clear important notes
            if (c.timeColor === "blue") return false; // clear blue banners
            return true;
          })
          .map((c) => {
            if (c.day !== DAY_KEY || c.type === "important") return c;
            return { ...c, statuses: {}, note: "", statusDate: today };
          });

        allClasses = updated;
        dayResets = { ...dayResets, [DAY_KEY]: today };
        setDoc(docRef, { classes: updated, dayResets }, { merge: true }).catch(
          (e) => {
            console.error(e);
            statusEl.textContent = "sync error";
          },
        );
      }

      // ---- render ----
      function render() {
        const classes = dayClasses();
        const importants = dayImportants();
        container.innerHTML = "";
        if (classes.length === 0 && importants.length === 0) {
          container.appendChild(emptyHint);
          return;
        }
        classes.forEach((c) => {
          const card = document.createElement("div");
          card.className = "class-card";

          const head = document.createElement("div");
          head.className = "class-head";
          if (c.timeColor === "blue") head.classList.add("banner-blue");
          const timeSpan = document.createElement("span");
          timeSpan.className = "time";
          timeSpan.textContent = c.time || "No time set";
          head.appendChild(timeSpan);
          if (c.label) {
            const labelSpan = document.createElement("span");
            labelSpan.className = "label";
            labelSpan.textContent = c.label;
            head.appendChild(labelSpan);
          }

          attachPress(head, {
            onTap: () => openClassSheet(c.id),
          });
          card.appendChild(head);
          if (c.note) {
            const noteSpan = document.createElement("span");
            noteSpan.className = "note";
            noteSpan.textContent = c.note;
            head.appendChild(noteSpan);
          }
          if (c.timeColor !== "blue") {
            const roster = document.createElement("div");
            roster.className = "roster";
            const ids = c.studentIds || [];
            if (ids.length === 0) {
              const empty = document.createElement("div");
              empty.className = "no-students";
              empty.textContent =
                "No students assigned. Long-press the class time to edit roster.";
              roster.appendChild(empty);
            } else {
              ids.forEach((sid) => {
                const status = (c.statuses && c.statuses[sid]) || "present";
                const chip = document.createElement("div");
                chip.className = `student-chip st-${status}`;
                const dot = document.createElement("span");
                dot.className = "status-dot";
                const name = document.createElement("span");
                name.className = "student-name";
                name.textContent = studentName(sid);
                chip.appendChild(dot);
                chip.appendChild(name);
                attachPress(chip, {
                  onTap: () => openStatusSheet(c.id, sid),
                });
                roster.appendChild(chip);
              });
            }
            card.appendChild(roster);
          }
          container.appendChild(card);
        });

        importants.forEach((imp) => {
          const card = document.createElement("div");
          card.className = "class-card important-card";
          const text = document.createElement("div");
          text.className = "important-text";
          text.textContent = imp.text;
          card.appendChild(text);
          attachPress(card, {
            onLongPress: () => openImportantSheet(imp.id),
          });
          container.appendChild(card);
        });
      }

      // ---- class action sheet ----
      const classOverlay = document.getElementById("classOverlay");
      const classSheetTitle = document.getElementById("classSheetTitle");

      function openClassSheet(classId) {
        activeClassId = classId;
        const c = allClasses.find((c) => c.id === classId);
        classSheetTitle.textContent = c
          ? c.time + (c.label ? " — " + c.label : "")
          : "Class";
        classOverlay.classList.add("show");
      }
      function closeClassSheet() {
        classOverlay.classList.remove("show");
      }
      document
        .getElementById("classCancelBtn")
        .addEventListener("click", closeClassSheet);
      classOverlay.addEventListener("click", (e) => {
        if (e.target === classOverlay) closeClassSheet();
      });
      document
        .getElementById("deleteClassBtn")
        .addEventListener("click", () => {
          const c = allClasses.find((c) => c.id === activeClassId);
          if (
            c &&
            confirm(`Delete class ${c.time}${c.label ? " — " + c.label : ""}?`)
          ) {
            saveClasses(allClasses.filter((cl) => cl.id !== activeClassId));
          }
          closeClassSheet();
        });

      function moveClass(direction) {
        const list = dayClasses();
        const idx = list.findIndex((c) => c.id === activeClassId);
        if (idx === -1) return;
        const swapIdx = direction === "up" ? idx - 1 : idx + 1;
        if (swapIdx < 0 || swapIdx >= list.length) return;
        const a = list[idx];
        const b = list[swapIdx];
        const newAll = [...allClasses];
        const aRealIdx = newAll.findIndex((c) => c.id === a.id);
        const bRealIdx = newAll.findIndex((c) => c.id === b.id);
        [newAll[aRealIdx], newAll[bRealIdx]] = [
          newAll[bRealIdx],
          newAll[aRealIdx],
        ];
        saveClasses(newAll);
      }
      document
        .getElementById("moveClassUpBtn")
        .addEventListener("click", () => {
          moveClass("up");
          closeClassSheet();
        });
      document
        .getElementById("moveClassDownBtn")
        .addEventListener("click", () => {
          moveClass("down");
          closeClassSheet();
        });

      // ---- fab choice sheet ----
      const fabChoiceOverlay = document.getElementById("fabChoiceOverlay");
      const timeBlueCheckbox = document.getElementById("timeBlueCheckbox");

      document.getElementById("addClassBtn").addEventListener("click", () => {
        fabChoiceOverlay.classList.add("show");
      });
      document
        .getElementById("fabChoiceCancelBtn")
        .addEventListener("click", () => {
          fabChoiceOverlay.classList.remove("show");
        });
      fabChoiceOverlay.addEventListener("click", (e) => {
        if (e.target === fabChoiceOverlay)
          fabChoiceOverlay.classList.remove("show");
      });

      // ---- add / edit time+label ----
      const classFormOverlay = document.getElementById("classFormOverlay");
      const classFormTitle = document.getElementById("classFormTitle");
      const classTimeInput = document.getElementById("classTimeInput");
      const classLabelInput = document.getElementById("classLabelInput");
      const classNoteInput = document.getElementById("classNoteInput");

      let formMode = "add"; // "add" | "edit"

      document
        .getElementById("addClassChoiceBtn")
        .addEventListener("click", () => {
          fabChoiceOverlay.classList.remove("show");
          formMode = "add";
          classFormTitle.textContent = "Add Class";
          classTimeInput.value = "";
          classLabelInput.value = "";
          classNoteInput.value = "";

          timeBlueCheckbox.checked = false;
          classFormOverlay.classList.add("show");
          setTimeout(() => classTimeInput.focus(), 50);
        });
      document.getElementById("editTimeBtn").addEventListener("click", () => {
        formMode = "edit";
        const c = allClasses.find((c) => c.id === activeClassId);
        classFormTitle.textContent = "Edit Time / Label / Note";
        classTimeInput.value = c ? c.time || "" : "";
        classLabelInput.value = c ? c.label || "" : "";
        classNoteInput.value = c ? c.note || "" : "";

        timeBlueCheckbox.checked = c ? c.timeColor === "blue" : false;
        classOverlay.classList.remove("show");
        classFormOverlay.classList.add("show");
      });
      document
        .getElementById("classFormCancelBtn")
        .addEventListener("click", () => {
          classFormOverlay.classList.remove("show");
        });
      classFormOverlay.addEventListener("click", (e) => {
        if (e.target === classFormOverlay)
          classFormOverlay.classList.remove("show");
      });
      document
        .getElementById("saveClassFormBtn")
        .addEventListener("click", () => {
          const time = classTimeInput.value.trim();
          const label = classLabelInput.value.trim();
          const note = classNoteInput.value.trim();

          const timeColor = timeBlueCheckbox.checked ? "blue" : null;
          if (!time) {
            toast("Enter a time");
            return;
          }
          if (formMode === "add") {
            const newClass = {
              id: newId(),
              day: DAY_KEY,
              time,
              label,
              note,
              studentIds: [],
              statuses: {},
              timeColor,
            };
            saveClasses([...allClasses, newClass]);
          } else {
            const list = allClasses.map((c) =>
              c.id === activeClassId
                ? { ...c, time, label, note, timeColor }
                : c,
            );
            saveClasses(list);
          }
          classFormOverlay.classList.remove("show");
        });

      // ---- important note sheet ----
      let importantFormMode = "add";
      let activeImportantId = null;
      const importantFormOverlay = document.getElementById(
        "importantFormOverlay",
      );
      const importantFormTitle = document.getElementById("importantFormTitle");
      const importantTextInput = document.getElementById("importantTextInput");
      const importantOverlay = document.getElementById("importantOverlay");
      const importantSheetTitle = document.getElementById(
        "importantSheetTitle",
      );

      document
        .getElementById("addImportantChoiceBtn")
        .addEventListener("click", () => {
          fabChoiceOverlay.classList.remove("show");
          importantFormMode = "add";
          importantFormTitle.textContent = "Add Important Note";
          importantTextInput.value = "";
          importantFormOverlay.classList.add("show");
          setTimeout(() => importantTextInput.focus(), 50);
        });

      document
        .getElementById("importantFormCancelBtn")
        .addEventListener("click", () => {
          importantFormOverlay.classList.remove("show");
        });
      importantFormOverlay.addEventListener("click", (e) => {
        if (e.target === importantFormOverlay)
          importantFormOverlay.classList.remove("show");
      });

      document
        .getElementById("saveImportantBtn")
        .addEventListener("click", () => {
          const text = importantTextInput.value.trim();
          if (!text) {
            toast("Enter a note");
            return;
          }
          if (importantFormMode === "add") {
            const newImportant = {
              id: newId(),
              day: DAY_KEY,
              type: "important",
              text,
            };
            saveClasses([...allClasses, newImportant]);
          } else {
            const list = allClasses.map((c) =>
              c.id === activeImportantId ? { ...c, text } : c,
            );
            saveClasses(list);
          }
          importantFormOverlay.classList.remove("show");
        });

      function openImportantSheet(id) {
        activeImportantId = id;
        const imp = allClasses.find((c) => c.id === id);
        importantSheetTitle.textContent = imp ? imp.text : "Important";
        importantOverlay.classList.add("show");
      }
      function closeImportantSheet() {
        importantOverlay.classList.remove("show");
      }
      document
        .getElementById("importantCancelBtn")
        .addEventListener("click", closeImportantSheet);
      importantOverlay.addEventListener("click", (e) => {
        if (e.target === importantOverlay) closeImportantSheet();
      });

      document
        .getElementById("editImportantBtn")
        .addEventListener("click", () => {
          const imp = allClasses.find((c) => c.id === activeImportantId);
          importantFormMode = "edit";
          importantFormTitle.textContent = "Edit Important Note";
          importantTextInput.value = imp ? imp.text : "";
          importantOverlay.classList.remove("show");
          importantFormOverlay.classList.add("show");
        });

      document
        .getElementById("deleteImportantBtn")
        .addEventListener("click", () => {
          const imp = allClasses.find((c) => c.id === activeImportantId);
          if (imp && confirm(`Delete note: "${imp.text}"?`)) {
            saveClasses(allClasses.filter((c) => c.id !== activeImportantId));
          }
          closeImportantSheet();
        });

      // ---- roster edit ----
      const rosterOverlay = document.getElementById("rosterOverlay");
      const rosterCheckList = document.getElementById("rosterCheckList");

      document.getElementById("editRosterBtn").addEventListener("click", () => {
        const c = allClasses.find((c) => c.id === activeClassId);
        const currentIds = new Set((c && c.studentIds) || []);
        rosterCheckList.innerHTML = "";
        const candidates = dayStudents();
        if (candidates.length === 0) {
          const p = document.createElement("div");
          p.className = "no-students";
          p.textContent =
            "No students on this day yet. Add them in Payments first.";
          rosterCheckList.appendChild(p);
        }
        candidates.forEach((s) => {
          const row = document.createElement("label");
          row.className = "roster-check-row";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.value = s.id;
          cb.checked = currentIds.has(s.id);
          const span = document.createElement("span");
          span.textContent = s.name;
          row.appendChild(cb);
          row.appendChild(span);
          rosterCheckList.appendChild(row);
        });
        classOverlay.classList.remove("show");
        rosterOverlay.classList.add("show");
      });
      document
        .getElementById("rosterCancelBtn")
        .addEventListener("click", () => {
          rosterOverlay.classList.remove("show");
        });
      rosterOverlay.addEventListener("click", (e) => {
        if (e.target === rosterOverlay) rosterOverlay.classList.remove("show");
      });
      document.getElementById("saveRosterBtn").addEventListener("click", () => {
        const checked = [
          ...rosterCheckList.querySelectorAll("input[type=checkbox]:checked"),
        ].map((cb) => cb.value);
        const list = allClasses.map((c) => {
          if (c.id !== activeClassId) return c;
          const statuses = { ...(c.statuses || {}) };
          Object.keys(statuses).forEach((sid) => {
            if (!checked.includes(sid)) delete statuses[sid];
          });
          return { ...c, studentIds: checked, statuses };
        });
        saveClasses(list);
        rosterOverlay.classList.remove("show");
      });
      document
        .getElementById("addNewStudentBtn")
        .addEventListener("click", async () => {
          const input = document.getElementById("newStudentInput");
          const name = input.value.trim();
          if (!name) {
            toast("Enter a name");
            return;
          }
          const student = { id: newId(), day: DAY_KEY, name };
          await saveStudents([...allStudents, student]);
          input.value = "";

          const noStudentsMsg = rosterCheckList.querySelector(".no-students");
          if (noStudentsMsg) noStudentsMsg.remove();

          const row = document.createElement("label");
          row.className = "roster-check-row";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.value = student.id;
          cb.checked = true;
          const span = document.createElement("span");
          span.textContent = student.name;
          row.appendChild(cb);
          row.appendChild(span);
          rosterCheckList.appendChild(row);
        });
      // ---- status action sheet ----
      const statusOverlay = document.getElementById("statusOverlay");
      const statusSheetTitle = document.getElementById("statusSheetTitle");

      function openStatusSheet(classId, studentId) {
        activeClassId = classId;
        activeStudentId = studentId;
        statusSheetTitle.textContent = studentName(studentId);
        statusOverlay.classList.add("show");
      }
      function closeStatusSheet() {
        statusOverlay.classList.remove("show");
      }
      document
        .getElementById("statusCancelBtn")
        .addEventListener("click", closeStatusSheet);
      statusOverlay.addEventListener("click", (e) => {
        if (e.target === statusOverlay) closeStatusSheet();
      });

      function setStatus(status) {
        const list = allClasses.map((c) => {
          if (c.id !== activeClassId) return c;
          const statuses = { ...(c.statuses || {}) };
          statuses[activeStudentId] = status;
          return { ...c, statuses };
        });
        logAttendance(activeClassId, activeStudentId, status);
        saveClasses(list);
        closeStatusSheet();
      }
      function logAttendance(classId, studentId, status) {
        const dateStr = todayStr();
        const newLog = { ...attendanceLog };
        const classLog = { ...(newLog[classId] || {}) };
        const dayLog = { ...(classLog[dateStr] || {}) };
        if (status === "absent") {
          dayLog[studentId] = "absent";
        } else {
          delete dayLog[studentId]; // present or special both count as present in the register
        }
        if (Object.keys(dayLog).length === 0) {
          delete classLog[dateStr];
        } else {
          classLog[dateStr] = dayLog;
        }
        if (Object.keys(classLog).length === 0) {
          delete newLog[classId];
        } else {
          newLog[classId] = classLog;
        }
        attendanceLog = newLog;
        setDoc(docRef, { attendanceLog: newLog }, { merge: true }).catch(
          (e) => {
            console.error(e);
            statusEl.textContent = "sync error";
          },
        );
      }
      document
        .getElementById("setPresentBtn")
        .addEventListener("click", () => setStatus("present"));
      document
        .getElementById("setAbsentBtn")
        .addEventListener("click", () => setStatus("absent"));
      document
        .getElementById("setSpecialBtn")
        .addEventListener("click", () => setStatus("special"));

      // ---- toast ----
      let toastTimer = null;
      function toast(msg) {
        const el = document.getElementById("toast") || createToastEl();
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
      }
      function createToastEl() {
        const el = document.createElement("div");
        el.id = "toast";
        document.body.appendChild(el);
        return el;
      }

      // ---- unified press handler ----
      function attachPress(el, { onTap, onLongPress, delay = LONG_PRESS_MS }) {
        let timer = null;
        let longPressed = false;
        let startX = 0;
        let startY = 0;

        function start(e) {
          longPressed = false;
          startX = e.clientX;
          startY = e.clientY;
          el.classList.add("pressed");
          timer = setTimeout(() => {
            longPressed = true;
            el.classList.remove("pressed");
            if (navigator.vibrate) navigator.vibrate(15);
            onLongPress && onLongPress();
          }, delay);
        }
        function move(e) {
          if (
            Math.abs(e.clientX - startX) > MOVE_TOLERANCE ||
            Math.abs(e.clientY - startY) > MOVE_TOLERANCE
          ) {
            clearTimeout(timer);
            el.classList.remove("pressed");
          }
        }
        function end() {
          clearTimeout(timer);
          el.classList.remove("pressed");
          if (!longPressed && onTap) onTap();
        }
        function cancel() {
          clearTimeout(timer);
          el.classList.remove("pressed");
        }

        el.addEventListener("pointerdown", start);
        el.addEventListener("pointermove", move);
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", cancel);
        el.addEventListener("pointerleave", cancel);
        el.addEventListener("contextmenu", (e) => e.preventDefault());
      }
    </script>
  </body>
</html>
